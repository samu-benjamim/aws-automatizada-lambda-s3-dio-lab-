AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Stack CloudFormation — Lambda Function + S3
  Lab DIO: Tarefas Automatizadas com AWS Lambda e S3.
  Provisiona: 2 buckets S3 + IAM Role + 3 Lambda Functions
  com triggers configurados automaticamente.

# ─────────────────────────────────────────────
# PARAMETROS
# ─────────────────────────────────────────────
Parameters:

  Ambiente:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  NomeProjeto:
    Type: String
    Default: lambda-s3-dio
    Description: Prefixo usado nos nomes dos recursos

# ─────────────────────────────────────────────
# RECURSOS
# ─────────────────────────────────────────────
Resources:

  # ── Buckets S3 ───────────────────────────────

  BucketOrigem:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${NomeProjeto}-origem-${Ambiente}-${AWS::AccountId}"
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
            Function: !GetAtt FuncaoRegistrarUpload.Arn
          - Event: 's3:ObjectCreated:*'
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
                  - Name: suffix
                    Value: .csv
            Function: !GetAtt FuncaoProcessarCSV.Arn
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpirarArquivosAntigos
            Status: Enabled
            ExpirationInDays: 90
      Tags:
        - Key: Name
          Value: !Sub "${NomeProjeto}-origem-${Ambiente}"
        - Key: Environment
          Value: !Ref Ambiente
        - Key: ManagedBy
          Value: CloudFormation

  BucketDestino:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${NomeProjeto}-destino-${Ambiente}-${AWS::AccountId}"
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
            Function: !GetAtt FuncaoCopiarArquivo.Arn
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: !Sub "${NomeProjeto}-destino-${Ambiente}"
        - Key: Environment
          Value: !Ref Ambiente
        - Key: ManagedBy
          Value: CloudFormation

  # ── IAM Role para as Lambdas ─────────────────

  IAMRoleLambda:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "role-lambda-s3-${Ambiente}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaS3Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Permissao de leitura no bucket de origem
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectTagging
                Resource: !Sub "arn:aws:s3:::${NomeProjeto}-origem-${Ambiente}-${AWS::AccountId}/*"
              # Permissao de escrita no bucket de destino
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectTagging
                Resource: !Sub "arn:aws:s3:::${NomeProjeto}-destino-${Ambiente}-${AWS::AccountId}/*"
              # Permissao para gravar logs no CloudWatch
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
      Tags:
        - Key: Environment
          Value: !Ref Ambiente

  # ── Permissoes para o S3 invocar as Lambdas ──

  PermissaoS3InvocarRegistrar:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt FuncaoRegistrarUpload.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${NomeProjeto}-origem-${Ambiente}-${AWS::AccountId}"

  PermissaoS3InvocarCopiar:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt FuncaoCopiarArquivo.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${NomeProjeto}-destino-${Ambiente}-${AWS::AccountId}"

  PermissaoS3InvocarCSV:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt FuncaoProcessarCSV.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${NomeProjeto}-origem-${Ambiente}-${AWS::AccountId}"

  # ── Lambda 1: Registrar Upload ───────────────

  FuncaoRegistrarUpload:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${NomeProjeto}-registrar-upload-${Ambiente}"
      Description: Registra uploads no CloudWatch Logs com informacoes detalhadas
      Runtime: python3.12
      Handler: registrar-upload.lambda_handler
      Role: !GetAtt IAMRoleLambda.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          AMBIENTE: !Ref Ambiente
      Code:
        ZipFile: |
          import json, logging, urllib.parse
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          def lambda_handler(event, context):
              for record in event.get('Records', []):
                  bucket = record['s3']['bucket']['name']
                  chave = urllib.parse.unquote_plus(record['s3']['object']['key'])
                  tamanho = record['s3']['object'].get('size', 0)
                  logger.info(json.dumps({'bucket': bucket, 'arquivo': chave, 'tamanho': tamanho}))
              return {'statusCode': 200, 'body': 'OK'}
      Tags:
        - Key: Environment
          Value: !Ref Ambiente
        - Key: ManagedBy
          Value: CloudFormation

  LogGroupRegistrar:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NomeProjeto}-registrar-upload-${Ambiente}"
      RetentionInDays: 30

  # ── Lambda 2: Copiar Arquivo ─────────────────

  FuncaoCopiarArquivo:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${NomeProjeto}-copiar-arquivo-${Ambiente}"
      Description: Copia arquivos do bucket de origem para o bucket de destino
      Runtime: python3.12
      Handler: copiar-arquivo.lambda_handler
      Role: !GetAtt IAMRoleLambda.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          BUCKET_DESTINO: !Sub "${NomeProjeto}-destino-${Ambiente}-${AWS::AccountId}"
          PREFIXO_DESTINO: processados/
          AMBIENTE: !Ref Ambiente
      Code:
        ZipFile: |
          import boto3, json, logging, os, urllib.parse
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          s3 = boto3.client('s3')
          BUCKET_DESTINO = os.environ.get('BUCKET_DESTINO', '')
          def lambda_handler(event, context):
              record = event['Records'][0]
              origem = record['s3']['bucket']['name']
              chave = urllib.parse.unquote_plus(record['s3']['object']['key'])
              s3.copy_object(CopySource={'Bucket': origem, 'Key': chave}, Bucket=BUCKET_DESTINO, Key=f"processados/{chave}")
              logger.info(f"Copiado: {chave} -> {BUCKET_DESTINO}/processados/{chave}")
              return {'statusCode': 200, 'body': 'Copiado'}
      Tags:
        - Key: Environment
          Value: !Ref Ambiente
        - Key: ManagedBy
          Value: CloudFormation

  LogGroupCopiar:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NomeProjeto}-copiar-arquivo-${Ambiente}"
      RetentionInDays: 30

  # ── Lambda 3: Processar CSV ──────────────────

  FuncaoProcessarCSV:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${NomeProjeto}-processar-csv-${Ambiente}"
      Description: Processa CSVs enviados ao S3 e salva resultado como JSON
      Runtime: python3.12
      Handler: processar-csv.lambda_handler
      Role: !GetAtt IAMRoleLambda.Arn
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          PASTA_RESULTADOS: resultados/
          ENCODING_CSV: utf-8
          AMBIENTE: !Ref Ambiente
      Code:
        ZipFile: |
          import boto3, csv, io, json, logging, os, urllib.parse
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          s3 = boto3.client('s3')
          def lambda_handler(event, context):
              record = event['Records'][0]
              bucket = record['s3']['bucket']['name']
              chave = urllib.parse.unquote_plus(record['s3']['object']['key'])
              response = s3.get_object(Bucket=bucket, Key=chave)
              conteudo = response['Body'].read().decode('utf-8')
              leitor = csv.DictReader(io.StringIO(conteudo))
              dados = list(leitor)
              resultado = json.dumps({'total': len(dados), 'dados': dados})
              chave_resultado = chave.replace('.csv', '_resultado.json')
              s3.put_object(Bucket=bucket, Key=f"resultados/{chave_resultado}", Body=resultado.encode('utf-8'), ContentType='application/json')
              logger.info(f"{len(dados)} registros processados")
              return {'statusCode': 200, 'body': f'{len(dados)} registros'}
      Tags:
        - Key: Environment
          Value: !Ref Ambiente
        - Key: ManagedBy
          Value: CloudFormation

  LogGroupCSV:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NomeProjeto}-processar-csv-${Ambiente}"
      RetentionInDays: 30

# ─────────────────────────────────────────────
# OUTPUTS
# ─────────────────────────────────────────────
Outputs:

  BucketOrigemNome:
    Description: Nome do bucket de origem (faca upload aqui)
    Value: !Ref BucketOrigem

  BucketDestinoNome:
    Description: Nome do bucket de destino (resultados aqui)
    Value: !Ref BucketDestino

  LambdaRegistrarArn:
    Description: ARN da funcao de registro de uploads
    Value: !GetAtt FuncaoRegistrarUpload.Arn

  LambdaCopiarArn:
    Description: ARN da funcao de copia de arquivos
    Value: !GetAtt FuncaoCopiarArquivo.Arn

  LambdaCSVArn:
    Description: ARN da funcao de processamento de CSV
    Value: !GetAtt FuncaoProcessarCSV.Arn

  InstrucaoTeste:
    Description: Como testar — faca upload de um CSV nesta pasta
    Value: !Sub "aws s3 cp arquivo.csv s3://${BucketOrigem}/uploads/arquivo.csv"
